<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#101114" />
    <title>CodexL</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css?v=20260604-pwa-preserve-lang-v13" />
  </head>
  <body>
    <div id="controlView" class="control-view">
      <header class="topbar">
        <div class="topbar-left">
          <button id="backButton" class="icon-button back-button" type="button" title="返回实例列表" aria-label="返回实例列表">‹</button>
          <div id="subtitle" class="subtitle">连接中</div>
        </div>
        <div class="topbar-actions">
          <select id="remoteModeSelect" class="mode-select" aria-label="远程模式" hidden>
            <option value="web">Web</option>
          </select>
          <button id="secureWebButton" class="mode-select secure-web-button" type="button" title="使用 HTTPS" aria-label="使用 HTTPS" hidden>使用 HTTPS</button>
          <select id="webAssetVersionSelect" class="mode-select web-asset-version-select" aria-label="Codex App Web 包版本" title="Codex App Web 包版本" hidden>
            <option value="latest">最新</option>
          </select>
          <div id="pageZoomControl" class="zoom-control">
            <button
              id="pageZoomButton"
              class="zoom-button"
              type="button"
              title="页面缩放"
              aria-label="页面缩放"
              aria-haspopup="true"
              aria-expanded="false"
            >
              <span id="pageZoomLabel">1x</span>
            </button>
            <div id="pageZoomMenu" class="zoom-menu" hidden>
              <input
                id="pageZoomSlider"
                class="zoom-slider"
                type="range"
                min="1"
                max="3"
                step="0.05"
                value="1"
                aria-label="页面缩放"
              />
              <div class="zoom-ticks" aria-hidden="true">
                <span>1x</span>
                <span>3x</span>
              </div>
            </div>
          </div>
          <select id="qualitySelect" class="quality-select" aria-label="画质">
            <option value="auto">自动</option>
            <option value="good">高画质</option>
            <option value="medium">流畅</option>
            <option value="bad">省流</option>
          </select>
        </div>
      </header>

      <main class="viewport">
        <div id="screenWrap" class="screen-wrap">
          <canvas id="screen" class="screen" aria-label="Codex 应用画面" hidden></canvas>
          <iframe id="webFrame" class="web-frame" title="Codex Web 桥接页" allow="camera *; microphone *" hidden></iframe>
          <div id="emptyState" class="empty-state" role="status" aria-live="polite">
            <div id="emptyStateTitle" class="empty-state-title">正在连接</div>
            <div id="emptyStateMessage" class="empty-state-message">正在加载 Web 桥接</div>
            <div id="emptyStateActions" class="empty-state-actions" hidden>
              <button id="emptyRetryButton" class="primary-button" type="button">重试</button>
              <button id="emptyBackButton" class="secondary-button" type="button">返回实例列表</button>
            </div>
          </div>
        </div>
      </main>

      <div id="passwordGate" class="password-gate" hidden>
        <form id="passwordForm" class="password-panel">
          <h1>远程密码</h1>
          <p>该工作区需要输入桌面端设置的远程密码。</p>
          <input
            id="passwordInput"
            class="password-input"
            type="password"
            autocomplete="current-password"
            autocapitalize="none"
            spellcheck="false"
            placeholder="密码"
          />
          <button class="primary-button" type="submit">连接</button>
          <div id="passwordStatus" class="password-status" aria-live="polite"></div>
        </form>
      </div>

      <textarea
        id="keyboardProxy"
        class="keyboard-proxy"
        aria-label="键盘输入代理"
        autocomplete="off"
        autocapitalize="none"
        spellcheck="false"
        inputmode="text"
      ></textarea>
    </div>

    <script src="vendor/jsQR.js?v=20260604-pwa-preserve-lang-v13"></script>
    <script src="app.js?v=20260604-pwa-preserve-lang-v13" type="module"></script>
  </body>
</html>
